name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: package-lock.json is in sync with package.json
        run: npm install --package-lock-only --ignore-scripts && git diff --exit-code package-lock.json
      - run: npm run check:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generated types match the pinned spec
        run: npm run spec:generate && git diff --exit-code src/generated spec/VERSION.json
